name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mici_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mici_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mici_test?schema=public
      AUTH_SECRET: ci-secret-for-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes de integração (isolamento de tenant)
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-secret-for-build-only
